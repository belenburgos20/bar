<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-ey.png" />
    <link rel="apple-touch-icon" href="/logo-ey.png" />

    <!-- viewport-fit=cover: usa el alto real en iPhone, sin franjas raras. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />

    <title>Ey! Bar y Copas — Menú</title>
    <meta
      name="description"
      content="Menú digital de Ey! Bar y Copas: tablas de tapeo, coctelería, bodega, whiskys, combos y las promos de la noche."
    />

    <!-- Vista previa al compartir el link por WhatsApp o Instagram. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ey! Bar y Copas — Menú" />
    <meta
      property="og:description"
      content="Enfocado en lo que suma. Conectado con lo que importa."
    />
    <meta property="og:image" content="/logo-ey.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Para ver el menú necesitás activar JavaScript en tu navegador.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
