[build]
  command = "npm run build"
  publish = "dist"

# Es una SPA: /admin lo resuelve React Router, no un archivo en el servidor.
# Sin esta regla, recargar la página en /admin daría 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los assets llevan hash en el nombre, así que se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
